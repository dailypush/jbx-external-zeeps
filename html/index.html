<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZeepleDomeUI</title>
    <!-- Include Anime.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        body {
            margin: 0;
            color: #000;
        }

        @font-face {
            font-family: "font";
            src: url(font.ttf);
        }

        * {
            line-height: 100%;
            box-sizing: border-box;
            font-family: "font";
        }

        .main-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 1280px;
            height: 115px;
            background-image: url(space_background.png);
            background-size: 100%;
            padding: 25px 0 0 15px;
            text-align: left;
        }

        .player {
            position: relative;
            width: 164px;
            height: 51px;
            display: inline-block;
            margin-right: 10px;
        }

        .player:nth-child(3) {
            margin-right: 223px;
        }

        .player:last-child {
            margin-right: 0;
        }

        .player-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 100% 100%;
            z-index: 2;
        }

        .player-name {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1px 49px 0 36px;
            font-size: 17px;
            white-space: nowrap;
            z-index: 5;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
        }

        .middle-text {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 4;
            color: #000;
            font-size: 16px;
            padding-right: 5px;
        }

        .middle-text > svg {
            height: 14px;
            vertical-align: top;
            margin: 1px -3px 0 0;
        }

        .player-health-outer {
            position: absolute;
            width: 120px;
            height: 10px;
            border: 2px solid #000;
            border-radius: 0 0 5px 5px;
            left: 20px;
            top: 42px;
            overflow: hidden;
        }

        .player-health-inner {
            position: absolute;
            height: 100%;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="main-bar"></div>
    <script>
        // Color blending function
        const pSBC = (p, c0, c1, l) => {
            let r, g, b, P, f, t, h, i = parseInt, m = Math.round, a = typeof (c1) == "string";
            if (typeof (p) != "number" || p < -1 || p > 1 || typeof (c0) != "string" || (c0[0] != 'r' && c0[0] != '#') || (c1 && !a)) return null;
            const pSBCr = (d) => {
                let n = d.length, x = {};
                if (n > 9) {
                    [r, g, b, a] = d = d.split(","), n = d.length;
                    if (n < 3 || n > 4) return null;
                    x.r = i(r[3] == "a" ? r.slice(5) : r.slice(4)), x.g = i(g), x.b = i(b), x.a = a ? parseFloat(a) : -1;
                } else {
                    if (n == 8 || n == 6 || n < 4) return null;
                    if (n < 6) d = "#" + d[1] + d[1] + d[2] + d[2] + d[3] + d[3] + (n > 4 ? d[4] + d[4] : "");
                    d = i(d.slice(1), 16);
                    if (n == 9 || n == 5) {
                        x.r = d >> 24 & 255; x.g = d >> 16 & 255; x.b = d >> 8 & 255; x.a = m((d & 255) / 0.255) / 1000;
                    } else {
                        x.r = d >> 16; x.g = d >> 8 & 255; x.b = d & 255; x.a = -1;
                    }
                }
                return x;
            };
            h = c0.length > 9;
            h = a ? c1.length > 9 ? true : c1 === "c" ? !h : false : h;
            f = pSBCr(c0);
            P = p < 0;
            t = c1 && c1 !== "c" ? pSBCr(c1) : P ? { r: 0, g: 0, b: 0, a: -1 } : { r: 255, g: 255, b: 255, a: -1 };
            p = P ? p * -1 : p;
            P = 1 - p;
            if (!f || !t) return null;
            if (l) {
                r = m(P * f.r + p * t.r);
                g = m(P * f.g + p * t.g);
                b = m(P * f.b + p * t.b);
            } else {
                r = m((P * f.r ** 2 + p * t.r ** 2) ** 0.5);
                g = m((P * f.g ** 2 + p * t.g ** 2) ** 0.5);
                b = m((P * f.b ** 2 + p * t.b ** 2) ** 0.5);
            }
            a = f.a;
            t = t.a;
            f = a >= 0 || t >= 0;
            a = f ? a < 0 ? t : t < 0 ? a : a * P + t * p : 0;
            if (h) {
                return "rgb" + (f ? "a(" : "(") + r + "," + g + "," + b + (f ? "," + m(a * 1000) / 1000 : "") + ")";
            } else {
                return "#" + (4294967296 + r * 16777216 + g * 65536 + b * 256 + (f ? m(a * 255) : 0)).toString(16).slice(1, f ? undefined : -2);
            }
        };

        class Player {
            constructor(player) {
                this.current = player;
                this.hidden = false;

                // Create player wrapper
                this.wrapper = document.createElement('div');
                this.wrapper.classList.add('player');
                document.querySelector('.main-bar').appendChild(this.wrapper);

                // Create player background
                const playerBackground = document.createElement('div');
                playerBackground.classList.add('player-background');
                playerBackground.style.backgroundImage = 'url("data:image/svg+xml;utf8,' + encodeURIComponent(this.createSVG()) + '")';
                this.wrapper.appendChild(playerBackground);

                // Create player name
                this.name = document.createElement('div');
                this.name.classList.add('player-name');
                this.name.style.color = pSBC(-0.8, this.current.color);
                this.wrapper.appendChild(this.name);

                // Create middle text
                this.middleText = document.createElement('div');
                this.middleText.classList.add('middle-text');
                this.wrapper.appendChild(this.middleText);

                // Create health bar
                const healthOuter = document.createElement('div');
                healthOuter.classList.add('player-health-outer');
                healthOuter.style.backgroundColor = pSBC(0.7, this.current.color);
                this.wrapper.appendChild(healthOuter);

                this.healthbar = document.createElement('div');
                this.healthbar.classList.add('player-health-inner');
                this.healthbar.style.backgroundColor = pSBC(0, this.current.color);
                healthOuter.appendChild(this.healthbar);

                this.change(this.current, true);
            }

            createSVG() {
                const color1 = this.current.color;
                const color2 = pSBC(-0.2, this.current.color);
                const color3 = pSBC(-0.4, this.current.color);
                const color4 = pSBC(-0.9, this.current.color);

                // SVG content (truncated for brevity)
                const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 281.59161 88.663857" width="281.59161" height="88.663857">
                    <!-- SVG content goes here -->
                </svg>`;
                return svgContent;
            }

            formattedCash(value) {
                const sign = value < 0 ? "-" : "";
                return `${sign}§${Math.abs(value).toLocaleString()}`;
            }

            show() {
                if (!this.hidden) return;
                this.hidden = false;
                anime({
                    targets: this.wrapper,
                    top: 0,
                    opacity: 1,
                    scale: 1,
                    easing: "easeInOutQuart",
                    duration: 1000
                });
            }

            hide() {
                if (this.hidden) return;
                this.hidden = true;
                anime.set(this.wrapper, { rotate: 0 });
                anime.set(this.healthbar, { width: 0 });
                anime({
                    targets: this.wrapper,
                    scale: 0.9,
                    opacity: 0.5,
                    easing: "easeInOutQuart",
                    duration: 1000
                });
            }

            change(np, forceAll) {
                this.name.innerHTML = np.name;
                const changes = Object.keys(np).filter(k => forceAll || np[k] !== this.current[k]);

                if (np.health < this.current.health) {
                    anime({
                        targets: this.wrapper,
                        rotate: [{ value: 6, duration: 0 }, -4, 2, -2, 1, -1, 1, 0],
                        easing: "easeInOutQuart",
                        duration: 700
                    });
                }

                if (forceAll || changes.includes("health")) {
                    if (np.max && np.health) {
                        this.show();
                        const increase = np.health >= this.current.health;
                        anime({
                            targets: this.healthbar,
                            width: (np.health / np.max) * 100 + "%",
                            easing: increase ? "easeInOutSine" : "easeOutQuart",
                            duration: increase ? 1000 : 700
                        });
                    } else {
                        this.hide();
                    }
                }

                let middleText = `
                    <svg xmlns="http://www.w3.org/2000/svg" fill="#000000" width="18" height="18">
                        <!-- SVG content for money icon -->
                    </svg> ${this.formattedCash(np.moneyGauntlet)}`;

                if (np.max) {
                    middleText += `
                        <svg xmlns="http://www.w3.org/2000/svg" fill="#000000" width="18" height="18">
                            <!-- SVG content for health icon -->
                        </svg> ${np.health.toFixed(2)}`;
                }

                this.middleText.innerHTML = middleText;
                this.current = np;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            let players = [];
            let barHidden = false;

            const updateBar = () => {
                if (players.some(p => p.current.health)) {
                    if (!barHidden) return;
                    barHidden = false;
                    anime({
                        targets: ".main-bar",
                        top: 0,
                        easing: "easeOutQuart",
                        duration: 1500
                    });
                } else {
                    if (barHidden) return;
                    barHidden = true;
                    anime({
                        targets: ".main-bar",
                        top: "-100%",
                        easing: "easeInQuart",
                        duration: 1500
                    });
                }
            };
            updateBar();

            const ws = new WebSocket("ws://localhost:1284/");
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.reset) {
                    players.forEach(p => p.wrapper.remove());
                    players = [];
                    updateBar();
                    return;
                }
                data.players.sort((a, b) => a.index - b.index).forEach(p => {
                    if (!p) return;
                    if (players[p.index] && players[p.index].current.color !== p.color) {
                        players.forEach(p => p.wrapper.remove());
                        players = [];
                    }
                    if (players[p.index]) {
                        players[p.index].change(p);
                    } else {
                        players[p.index] = new Player(p);
                    }
                    updateBar();
                });
            };

            ws.onerror = (error) => {
                console.error("WebSocket error:", error);
            };

            ws.onclose = () => {
                console.warn("WebSocket connection closed.");
            };
        });
    </script>
</body>
</html>
